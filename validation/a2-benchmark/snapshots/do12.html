        /* Floating Nav */
        .floating-nav { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); z-index: 100; }

        .floating-nav-menu a:hover { background: #333; color: #c8a45a; }
        
        .category-section { padding: 40px 20px; max-width: 1400px; margin: 0 auto; scroll-margin-top: 20px; }
        .category-title { font-size: 2em; color: #c8a45a; margin-bottom: 30px; padding-bottom: 10px; border-bottom: 1px solid #333; text-transform: uppercase; letter-spacing: 2px; }

        .menu-item:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(200, 164, 90, 0.2); }

        .menu-item-image { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #333; }
        .menu-item.featured .menu-item-image { aspect-ratio: 1/1; }
        .menu-item-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .menu-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .menu-item-name { font-size: 1.2em; font-weight: bold; color: #fff; flex: 1; }
        .menu-item.featured .menu-item-name { font-size: 1.5em; }
        .menu-item-price { color: #c8a45a; font-weight: bold; font-size: 1.1em; white-space: nowrap; margin-left: 10px; }

        .menu-item-order:hover { background: #d4b56a; }

        footer { background: #000; padding: 40px 20px; text-align: center; border-top: 2px solid #c8a45a; margin-top: 40px; }
        footer p { color: #777; }
        @media (max-width: 768px) {
            .masonry-grid { grid-template-columns: 1fr; }
            .menu-item.featured { grid-column: span 1; grid-row: span 1; }
            header h1 { font-size: 1.8em; }
            .floating-nav { right: 10px; }
            .floating-nav-menu { right: 45px; }
        }

<body>
    <header><h1>The Food</h1></header>
    <nav class="floating-nav" id="floatingNav">
        <button class="floating-nav-toggle" onclick="toggleNav()">☰</button>
        <div class="floating-nav-menu" id="navMenu">
            <!-- Populated by JS -->
        </div>
    </nav>
    
    <section aria-label="Allergen information"><p class="allergen-ref"><a href="/millers-downtown-allergen-reference-guide.pdf" type="application/pdf">Allergen Reference Guide (PDF, 204 KB)</a></p></section>

    <main id="menu-container"></main>
    <section aria-label="Allergen information, end of menu"><p class="allergen-ref allergen-ref-end"><a href="/millers-downtown-allergen-reference-guide.pdf" type="application/pdf">Allergen Reference Guide (PDF, 204 KB)</a></p></section>
    <footer><p>Miller's Downtown | Eat. Drink. Listen. | Since 1981</p></footer>
    <script>
        const IMAGE_BASE = 'images/menu/';
        const ORDER_URL = 'order.html';
        const FEATURED_ITEMS = ['Chicken & Waffles', 'Wings', 'Fried Green Tomato Salad', 'Black & Blue Ridge Burger', 'Rib-Eye Steak & Cheese', 'Seven Layer Chocolate Cake'];
        
        function toggleNav() {
            document.getElementById('floatingNav').classList.toggle('open');
        }
        
        // Close nav when clicking outside
        document.addEventListener('click', (e) => {
            const nav = document.getElementById('floatingNav');
            if (!nav.contains(e.target)) {
                nav.classList.remove('open');
            }
        });
        
        async function loadMenu() {
            try {
                // Fetch from /api/menu (public-api; server-side lunch time-filter in ET; Phase-3 seam to the Focus cache).
                // Pass through _test_hour from URL so we can preview the lunch render without waiting for Friday 3pm.
                const testHour = new URLSearchParams(window.location.search).get('_test_hour');
                let url = '/api/menu?t=' + Date.now();
                if (testHour) url += '&_test_hour=' + encodeURIComponent(testHour);
                const response = await fetch(url);
                const data = await response.json();
                renderMenu(data);
                buildNav(data);
            } catch (error) {
                console.error('Error loading menu:', error);
                document.getElementById('menu-container').innerHTML = '<p style="text-align:center;padding:40px;color:#c8a45a;">Menu loading...</p>';
            }
        }
        
        function buildNav(data) {
            const navMenu = document.getElementById('navMenu');
            if (!navMenu) return;
            navMenu.textContent = '';
            data.categories.forEach(function(cat, i) {
                var a = document.createElement('a');
                a.href = '#section-' + i;
                a.textContent = cat.name;
                a.addEventListener('click', toggleNav);
                navMenu.appendChild(a);
            });
        }
        
        function renderMenu(data) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            data.categories.forEach((category, index) => {
                const section = document.createElement('section');
                section.className = 'category-section';
                section.id = 'section-' + index;
                const title = document.createElement('h2');
                title.className = 'category-title';
                title.textContent = category.name;
                section.appendChild(title);
                const grid = document.createElement('div');
                grid.className = 'masonry-grid';
                category.items.forEach(item => {
                    const card = createMenuCard(item);
                    grid.appendChild(card);
                });
                section.appendChild(grid);
                container.appendChild(section);
            });
        }
        
        function createMenuCard(item) {
            const card = document.createElement('div');
            card.className = 'menu-item';
            if (FEATURED_ITEMS.includes(item.name)) card.classList.add('featured');
            
            if (item.image) {
                const img = document.createElement('img');
                img.className = 'menu-item-image';
                img.src = IMAGE_BASE + item.image;
                img.alt = item.name;
                img.loading = 'lazy';
                card.appendChild(img);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'menu-item-image no-image';
                placeholder.innerHTML = '🍽️';
                card.appendChild(placeholder);
            }
            
            const content = document.createElement('div');
            content.className = 'menu-item-content';
            const header = document.createElement('div');
            header.className = 'menu-item-header';
            const name = document.createElement('h3');
            name.className = 'menu-item-name';
            name.textContent = item.name;
            header.appendChild(name);
            const price = document.createElement('span');
            price.className = 'menu-item-price';
            price.textContent = item.price;
            header.appendChild(price);
            content.appendChild(header);
            
            if (item.description) {
                const desc = document.createElement('p');
                desc.className = 'menu-item-description';
                desc.textContent = item.description;
                content.appendChild(desc);
            }
            
            // Only show Order button if carryout is available
            if (item.carryout) {
                const orderBtn = document.createElement('a');
                orderBtn.className = 'menu-item-order';
                orderBtn.href = ORDER_URL + '?item=' + item.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                orderBtn.target = '_blank';
                orderBtn.textContent = 'Order for Carryout';
                content.appendChild(orderBtn);
            }
            
            card.appendChild(content);
            return card;
        }
        
        document.addEventListener('DOMContentLoaded', loadMenu);
    </script>
