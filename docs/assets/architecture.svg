<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-labelledby="title desc">
  <title id="title">What's Good architecture</title>
  <desc id="desc">The Next.js frontend calls the Hono API on Cloudflare Workers. The API uses D1 for structured records, R2 for source files and Claude for extraction and recommendations. Apify supplies restaurant reviews.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#68776f"/></marker>
  </defs>
  <rect width="940" height="330" rx="16" fill="#fffdf8"/>
  <g fill="none" stroke="#68776f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M280 115H330"/>
    <path d="M280 259H305V165H330"/>
    <path d="M570 95H610V55H680" marker-start="url(#arrow)"/>
    <path d="M570 115H635V160H680"/>
    <path d="M570 140H610V265H680" marker-start="url(#arrow)"/>
  </g>
  <g stroke-width="1.5">
    <rect x="20" y="65" width="260" height="100" rx="12" fill="#f8cf59" stroke="#c8a23a"/>
    <rect x="330" y="65" width="240" height="100" rx="12" fill="#e1f0ef" stroke="#00838a"/>
    <rect x="20" y="224" width="260" height="70" rx="12" fill="#f3f5f1" stroke="#ced6cf"/>
    <rect x="680" y="20" width="240" height="70" rx="12" fill="#f3f5f1" stroke="#ced6cf"/>
    <rect x="680" y="125" width="240" height="70" rx="12" fill="#f3f5f1" stroke="#ced6cf"/>
    <rect x="680" y="230" width="240" height="70" rx="12" fill="#f3f5f1" stroke="#ced6cf"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#191919" text-anchor="middle">
    <g font-size="19" font-weight="700">
      <text x="150" y="99">Next.js + React</text><text x="450" y="99">Hono API</text>
      <text x="150" y="253">Apify</text><text x="800" y="49">D1 · SQLite</text>
      <text x="800" y="154">R2</text><text x="800" y="259">Claude</text>
    </g>
    <g font-size="14" fill="#44534b">
      <text x="150" y="125">Restaurant · scan · profile</text><text x="150" y="146">Results · ratings</text>
      <text x="450" y="125">Cloudflare Worker</text><text x="450" y="146">Validation + orchestration</text>
      <text x="150" y="277">Restaurant reviews</text><text x="800" y="73">Menus, reviews, profiles, ratings</text>
      <text x="800" y="178">Source snapshots + photos</text><text x="800" y="283">Extract · mine · recommend</text>
    </g>
  </g>
</svg>
